# =====================================================
# APPLICATION CONFIGURATION
# =====================================================

spring.application.name=ecommerce-backend

server.port=${SERVER_PORT:8080}


# =====================================================
# ENVIRONMENT VARIABLES
# =====================================================

# Loads backend/.env when running from the backend directory.
# Operating-system environment variables take precedence.

spring.config.import=optional:file:.env[.properties]


# =====================================================
# MYSQL DATABASE CONFIGURATION
# =====================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================

# Development: update database tables automatically.
# Production: use validate and database migrations.

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.open-in-view=false

spring.jpa.show-sql=${SHOW_SQL:false}

spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.jpa.properties.hibernate.format_sql=true


# =====================================================
# JWT AUTHENTICATION CONFIGURATION
# =====================================================

# JWT secret must be configured in the .env file.
# Do not hardcode the secret here.

app.jwt.secret=${JWT_SECRET}

# Token expiration: 1 hour (3600000 milliseconds).

app.jwt.expiration-ms=${JWT_EXPIRATION:3600000}


# =====================================================
# CORS CONFIGURATION
# =====================================================

# Allow requests from the React development server.

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# =====================================================
# ADMIN BOOTSTRAP CONFIGURATION
# =====================================================

# Optional: create the first admin account if supported
# by your application's bootstrap implementation.

app.bootstrap-admin.email=${ADMIN_EMAIL:}

app.bootstrap-admin.password=${ADMIN_PASSWORD:}

app.bootstrap-admin.name=${ADMIN_NAME:Store Administrator}


# =====================================================
# ERROR HANDLING
# =====================================================

# Do not expose internal exception details in API responses.

server.error.include-stacktrace=never

server.error.include-message=never

server.error.include-binding-errors=never


# =====================================================
# SWAGGER / OPENAPI CONFIGURATION
# =====================================================

# Enable API documentation during development.

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}